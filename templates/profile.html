<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-block-size: 100vh;
        padding: 20px;
      }
      .profile-container {
        background: rgb(203, 167, 167);
        border-radius: 12px;
        border: #667eea 2px solid;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        max-inline-size: 500px;
        inline-size: 100%;
        padding: 40px;
      }
      .profile-header {
        text-align: center;
        margin-block-end: 30px;
      }
      .profile-avatar {
        inline-size: 120px;
        block-size: 120px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 48px;
        color: white;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }
      .profile-header h1 {
        color: #1e293b;
        font-size: 1.8rem;
        margin-block-end: 5px;
      }
      .profile-header p {
        color: #64748b;
        font-size: 0.9rem;
      }
      .profile-section {
        margin-block-end: 25px;
      }
      .profile-section h2 {
        color: #475569;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-block-end: 10px;
        border-block-end: 2px solid #e2e8f0;
        padding-block-end: 8px;
      }
      .profile-info {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-block-end: 1px solid #f1f5f9;
      }
      .info-row:last-child {
        border-block-end: none;
      }
      .info-label {
        color: #64748b;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .info-value {
        color: #1e293b;
        font-weight: 500;
        font-size: 0.95rem;
      }
      .button-group {
        display: flex;
        gap: 12px;
        margin-block-start: 30px;
      }
      .btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.95rem;
      }
      .btn-primary {
        background-color: rgb(7, 126, 149);
        color: white;
      }
      .btn-primary:hover {
        background-color: rgb(5, 98, 116);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(7, 126, 149, 0.3);
      }
      .btn-secondary {
        background-color: #e2e8f0;
        color: #475569;
      }
      .btn-secondary:hover {
        background-color: #cbd5e1;
        transform: translateY(-2px);
      }
      .btn-logout {
        background-color: #dc2626;
        color: white;
      }
      .btn-logout:hover {
        background-color: #b91c1c;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
      }
      .loading {
        text-align: center;
        color: #64748b;
        padding: 40px 20px;
      }
      .error {
        background-color: #fee2e2;
        color: #dc2626;
        padding: 15px;
        border-radius: 6px;
        margin-block-end: 20px;
        border-inline-start: 4px solid #dc2626;
      }
    </style>
  </head>
  <body>
    <header
      style="
        text-align: center;
        padding: 1rem 0;
        font-size: 1rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 1px;
      "
    >
      TeenCodeHub
    </header>
    <div class="profile-container">
      <div id="profileContent">
        <div class="loading">
          <p>Loading profile...</p>
        </div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/";
      }

      async function loadProfile() {
        const token = localStorage.getItem("token");
        try {
          const response = await fetch("/api/profile", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await response.json();

          if (response.ok) {
            const avatarLetter = data.username.charAt(0).toUpperCase();

            const profileContent = document.getElementById("profileContent");
            profileContent.innerHTML = `
              <div class="profile-header">
                <div class="profile-avatar">${avatarLetter}</div>
                <h1>${data.username}</h1>
                <p>Member since ${new Date(data.registered_at).getFullYear()}</p>
              </div>

              <div class="profile-section">
                <h2>Personal Information</h2>
                <div class="profile-info">
                  <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value">${data.email}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Phone:</span>
                    <span class="info-value">${data.phone || "Not provided"}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Date of Birth:</span>
                    <span class="info-value">${data.dateofbirth}</span>
                  </div>
                </div>
              </div>

              <div class="profile-section">
                <h2>Account Details</h2>
                <div class="profile-info">
                  <div class="info-row">
                    <span class="info-label">Registered:</span>
                    <span class="info-value">${new Date(data.registered_at).toLocaleDateString()}</span>
                  </div>
                  <div class="info-row">
                    <span class="info-label">Username:</span>
                    <span class="info-value">${data.username}</span>
                  </div>
                </div>
              </div>

              <div class="button-group">
                <button class="btn btn-secondary" onclick="goToDashboard()">← Dashboard</button>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
              </div>
            `;
          } else {
            document.getElementById("profileContent").innerHTML = `
              <div class="error">Error loading profile: ${data.message}</div>
              <div class="button-group">
                <button class="btn btn-secondary" onclick="goToDashboard()">← Dashboard</button>
              </div>
            `;
            if (response.status === 401) {
              setTimeout(() => logout(), 2000);
            }
          }
        } catch (err) {
          document.getElementById("profileContent").innerHTML = `
            <div class="error">Server error. Please try again.</div>
            <div class="button-group">
              <button class="btn btn-secondary" onclick="location.reload()">Retry</button>
            </div>
          `;
        }
      }

      function goToDashboard() {
        window.location.href = "/dashboard";
      }

      function logout() {
        localStorage.removeItem("token");
        window.location.href = "/";
      }

      loadProfile();
    </script>
  </body>
</html>
