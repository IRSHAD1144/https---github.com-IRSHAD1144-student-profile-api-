<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header
      style="
        text-align: center;
        padding: 1rem 0;
        font-size: 1rem;
        font-weight: 700;
        color: #f02b57;
        letter-spacing: 1px;
      "
    >
     
    </header>
    <div class="container">
      <h1 style="color: rgb(240, 12, 57)">LOGIN</h1>
      <form id="loginForm" onsubmit="return handleLogin(event);">
        <input type="text" id="loginUsername" placeholder="Username" required />
        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        />
        <p id="loginError" style="color: red"></p>
        <button type="submit" id="loginBtn">Login</button>
        <div
          id="loginOtpSection"
          style="display: none; margin-block-start: 12px"
        >
          <input type="text" id="loginOtp" placeholder="Enter OTP" />
          <p id="otpError" style="color: red; font-size: 0.9rem"></p>
          <button
            type="button"
            onclick="verifyLoginOtp()"
            style="margin-block-start: 8px"
          >
            Verify OTP
          </button>
        </div>
        <p>
          NEW USER?
          <a href="/signup" style="color: rgb(240, 12, 57)">SIGN UP</a>
        </p>
      </form>
    </div>
    <script>
  async function handleLogin(event) {
    event.preventDefault();

    const username = document
      .getElementById("loginUsername")
      .value
      .trim();

    const password = document
      .getElementById("loginPassword")
      .value
      .trim();

    const errorElement =
      document.getElementById("loginError");

    errorElement.textContent = "";

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const data = await response.json();

      console.log("Login Response:", data);

      if (!response.ok) {
        errorElement.textContent =
          data.message || "Login failed";
        return;
      }

      if (data.otp_required) {
        document.getElementById(
          "loginOtpSection"
        ).style.display = "block";

        document.getElementById(
          "loginBtn"
        ).disabled = true;

        window._pendingLoginUser = username;

        errorElement.style.color = "green";

        if (data.otp) {
          errorElement.innerHTML = `
            OTP:
            <strong style="color:#e74c3c;font-size:1.1rem">
              ${data.otp}
            </strong>
          `;
        } else {
          errorElement.textContent =
            "OTP sent successfully.";
        }

        return;
      }

      if (data.token) {
        localStorage.setItem(
          "token",
          data.token
        );

        window.location.href =
          "/dashboard";
      }

    } catch (error) {
      console.error(error);

      errorElement.textContent =
        "Unable to connect to server.";
    }
  }

  async function verifyLoginOtp() {
    const otp =
      document
        .getElementById("loginOtp")
        .value
        .trim();

    const err =
      document.getElementById("otpError");

    err.textContent = "";

    if (!otp) {
      err.textContent =
        "Please enter OTP";
      return;
    }

    try {
      const response = await fetch(
        "/api/login/verify",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body: JSON.stringify({
            username:
              window._pendingLoginUser,
            otp
          })
        }
      );

      const data =
        await response.json();

      console.log(
        "OTP Verify Response:",
        data
      );

      if (!response.ok) {
        err.textContent =
          data.message ||
          "OTP verification failed";
        return;
      }

      localStorage.setItem(
        "token",
        data.token
      );

      window.location.href =
        "/dashboard";

    } catch (error) {
      console.error(error);

      err.textContent =
        "Server error. Please try again.";
    }
  }
</script>
  </body>
</html>
